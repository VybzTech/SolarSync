# =====================================================================
# SolarSync — Netlify build & CI/CD configuration
# VybzTech Inc. client delivery portal
# =====================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin the toolchain so a Netlify image upgrade cannot change the build.
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# ---------------------------------------------------------------------
# SPA fallback.
#
# CRITICAL: React Router handles routing client-side. Without this rule a
# deep link or hard refresh on /requests asks Netlify for a file that does
# not exist and returns 404. Serving index.html with a 200 lets the router
# resolve the path in the browser.
#
# Must remain the LAST redirect so it never shadows a more specific rule.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The portal is confidential; keep it out of search indexes.
    X-Robots-Tag = "noindex, nofollow"

# Vite emits content-hashed filenames, so assets are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML shell must never be cached, or clients keep loading a stale bundle.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------
# Deploy previews for every pull request
# ---------------------------------------------------------------------
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
